<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <g fill="#0f172a" fill-rule="evenodd">

    <!-- VIOLON, en haut à gauche, légèrement incliné -->
    <g transform="translate(80,55) rotate(-18)">
      <!-- corps en sablier -->
      <path d="M0,50 C-22,50 -34,72 -34,95 C-34,118 -16,135 0,135 C16,135 34,118 34,95 C34,72 22,50 0,50 Z
               M-34,90 C-30,86 -26,86 -22,90 C-26,94 -30,94 -34,90 Z
               M34,90 C30,86 26,86 22,90 C26,94 30,94 34,90 Z" />
      <!-- manche -->
      <rect x="-3" y="-5" width="6" height="58" />
      <!-- volute -->
      <circle cx="0" cy="-7" r="5" />
      <!-- chevalet / cordes (4 lignes blanches en évidement) -->
      <g stroke="#fff" stroke-width="0.6" fill="none">
        <line x1="-3" y1="-3" x2="-3" y2="110" />
        <line x1="-1" y1="-3" x2="-1" y2="110" />
        <line x1="1"  y1="-3" x2="1"  y2="110" />
        <line x1="3"  y1="-3" x2="3"  y2="110" />
      </g>
      <!-- ouïes -->
      <g fill="#fff">
        <path d="M-14,92 q-3,0 -3,4 q0,6 4,6 q-2,-2 -2,-5 q0,-3 1,-5 z" />
        <path d="M14,92 q3,0 3,4 q0,6 -4,6 q2,-2 2,-5 q0,-3 -1,-5 z" />
      </g>
    </g>

    <!-- VAUTOUR (gypaète) en vol plané, haut à droite -->
    <g transform="translate(380,90)">
      <!-- aile gauche -->
      <path d="M0,30 C 25,5 55,18 90,28 C 60,32 35,32 12,40 Z" />
      <!-- aile droite -->
      <path d="M180,30 C 155,5 125,18 90,28 C 120,32 145,32 168,40 Z" />
      <!-- corps + tête -->
      <ellipse cx="90" cy="30" rx="10" ry="5" />
      <path d="M98,29 L 108,27 L 108,32 L 98,33 Z" />
      <!-- queue cunéiforme -->
      <path d="M86,33 L 80,42 L 94,42 Z" />
    </g>

    <!-- LYNX assis, bas à gauche, profil 3/4 face -->
    <g transform="translate(105,240)">
      <!-- tête avec pinceaux d'oreilles -->
      <path d="M20,30 L 25,6 L 32,18 L 48,18 L 55,6 L 60,30
               C 64,40 60,50 50,52 L 30,52 C 20,50 16,40 20,30 Z" />
      <!-- joues / favoris -->
      <path d="M18,42 L 12,48 L 22,48 Z" />
      <path d="M62,42 L 68,48 L 58,48 Z" />
      <!-- yeux (évidements) -->
      <g fill="#fff">
        <ellipse cx="32" cy="32" rx="2" ry="3" />
        <ellipse cx="48" cy="32" rx="2" ry="3" />
      </g>
      <!-- corps assis -->
      <path d="M18,52 C 8,58 8,100 22,108 L 58,108 C 72,100 72,58 62,52
               L 62,80 L 70,80 L 70,108 L 60,108 L 60,90
               L 50,90 L 50,108 L 32,108 L 32,90 L 22,90 L 22,108
               L 12,108 L 12,80 L 18,80 Z" />
      <!-- queue tronquée -->
      <path d="M70,82 L 86,80 L 86,90 L 70,92 Z" />
    </g>

    <!-- CHAMOIS sur rocher, bas à droite, profil -->
    <g transform="translate(370,260)">
      <!-- corps -->
      <path d="M30,40 C 30,30 50,28 80,28 C 105,28 120,32 125,40
               L 125,55 L 118,55 L 118,80 L 110,80 L 110,55
               L 95,55 L 95,80 L 87,80 L 87,55
               L 60,55 L 60,80 L 52,80 L 52,55
               L 35,55 L 35,80 L 27,80 L 27,55
               L 27,45 Z" />
      <!-- tête -->
      <path d="M125,32 L 150,30 L 158,40 L 152,48 L 142,48 L 125,48 Z" />
      <!-- museau -->
      <circle cx="156" cy="40" r="2" fill="#fff" />
      <!-- cornes recourbées -->
      <g stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M138,30 C 138,22 142,16 146,12 C 148,14 146,18 144,22" />
        <path d="M144,30 C 144,22 148,16 152,12 C 154,14 152,18 150,22" />
      </g>
      <!-- rocher en dessous -->
      <path d="M15,80 L 30,82 L 45,80 L 70,82 L 95,80 L 125,82 L 140,80 L 142,90 L 14,90 Z" opacity="0.7" />
    </g>
  </g>
</svg>
